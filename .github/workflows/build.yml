{
 "name": "Build iOS IPA",
 "jobs": {
  "build": {
   "runs-on": "macos-15",
   "env": {
    "GODOT_VERSION": "4.3"
   },
   "steps": [
    {
     "uses": "actions/checkout@v4"
    },
    {
     "name": "Unzip project",
     "shell": "bash",
     "run": "unzip -q project.zip -d game\nif [ ! -f game/project.godot ]; then\n  P=$(find game -maxdepth 2 -name project.godot | head -1)\n  [ -n \"$P\" ] || { echo \"project.godot not found in zip\"; exit 1; }\n  mv \"$(dirname \"$P\")\" game_inner\n  rm -rf game\n  mv game_inner game\nfi\n"
    },
    {
     "name": "Add optional models and sounds",
     "shell": "bash",
     "run": "mkdir -p game/models game/sfx\nfor f in player.glb enemy.glb; do\n  if [ -f \"$f\" ]; then cp \"$f\" game/models/; fi\ndone\nfor f in sfx_*.wav sfx_*.ogg sfx_*.mp3; do\n  if [ -f \"$f\" ]; then cp \"$f\" game/sfx/; fi\ndone\nls game/models game/sfx\n"
    },
    {
     "name": "Install Godot and export templates",
     "shell": "bash",
     "run": "BASE=\"https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable\"\ncurl -fL -o godot.zip \"$BASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip\"\ncurl -fL -o templates.tpz \"$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz\"\nunzip -q godot.zip\nT=\"$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable\"\nmkdir -p \"$T\"\nunzip -q templates.tpz -d tpl\nmv tpl/templates/* \"$T/\"\n"
    },
    {
     "name": "Export Xcode project",
     "shell": "bash",
     "working-directory": "game",
     "run": "GODOT=\"$GITHUB_WORKSPACE/Godot.app/Contents/MacOS/Godot\"\n\"$GODOT\" --headless --import || true\nmkdir -p build/ios\n\"$GODOT\" --headless --export-release \"iOS\" build/ios/ZeroBurst.ipa || true\nls -R build/ios | head -40\ntest -d build/ios/ZeroBurst.xcodeproj\n"
    },
    {
     "name": "Build unsigned app",
     "shell": "bash",
     "working-directory": "game/build/ios",
     "run": "xcodebuild -project ZeroBurst.xcodeproj -target ZeroBurst \\\n  -configuration Release -sdk iphoneos SYMROOT=\"$PWD/out\" \\\n  CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \\\n  CODE_SIGN_IDENTITY=\"\" DEVELOPMENT_TEAM=\"\" PROVISIONING_PROFILE_SPECIFIER=\"\" \\\n  build\n"
    },
    {
     "name": "Package IPA",
     "shell": "bash",
     "run": "APP=$(find game/build/ios/out -maxdepth 3 -name \"*.app\" | head -1)\necho \"Found: $APP\"\nmkdir -p Payload\ncp -R \"$APP\" Payload/\nzip -qr ZeroBurst.ipa Payload\n"
    },
    {
     "uses": "actions/upload-artifact@v4",
     "with": {
      "name": "ZeroBurst-ipa",
      "path": "ZeroBurst.ipa"
     }
    }
   ]
  }
 },
 "on": {
  "push": null,
  "workflow_dispatch": null
 }
}
